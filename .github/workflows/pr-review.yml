name: AgriTrust PR Pre-Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AI_MODEL: "${{ secrets.AI_MODEL != '' && secrets.AI_MODEL || 'claude-sonnet-4-6' }}"

jobs:
  advisory-audit:
    name: Advisory Pre-Review
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check for Workflow Tampering
        run: |
          AUTHOR_ROLE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER -q .author_association)
          if [[ "$AUTHOR_ROLE" != "OWNER" && "$AUTHOR_ROLE" != "MEMBER" && "$AUTHOR_ROLE" != "COLLABORATOR" ]]; then
            CHANGED_FILES=$(gh pr view $PR_NUMBER --json files -q '.files[].path')
            if echo "$CHANGED_FILES" | grep -qE "^.github/|^\.gitignore"; then
              gh pr comment $PR_NUMBER --body "Automated notice: external contributors may not modify \`.github/\` or \`.gitignore\`. Please revert those changes so review can proceed."
              exit 1
            fi
          fi

      - name: Check for Issue Link
        run: |
          PR_BODY=$(gh pr view $PR_NUMBER --json body -q .body)
          if ! echo "$PR_BODY" | grep -Eiq "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) #[0-9]+"; then
            gh pr comment $PR_NUMBER --body "Thanks for the PR! Please link the issue it resolves in the description using \`Closes #ISSUE_NUMBER\` so we can track it."
            exit 1
          fi

      - name: Check Issue Assignment
        run: |
          PR_BODY=$(gh pr view $PR_NUMBER --json body -q .body)
          ISSUE_NUM=$(echo "$PR_BODY" | grep -oEi "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) #[0-9]+" | head -n1 | grep -oE "[0-9]+")

          if ! gh issue view "$ISSUE_NUM" --json state,title,assignees > /tmp/issue.json 2>/dev/null; then
            echo "Could not read linked issue #$ISSUE_NUM (may not exist)."
            exit 1
          fi

          STATE=$(jq -r .state /tmp/issue.json)
          if [ "$STATE" != "OPEN" ]; then
            gh pr review $PR_NUMBER --request-changes -b "The linked issue #$ISSUE_NUM is \`$STATE\`. Please link an open issue."
            exit 1
          fi

          ASSIGNEES=$(jq -r '[.assignees[].login] | join(",")' /tmp/issue.json)
          if [ -z "$ASSIGNEES" ] || ! echo ",$ASSIGNEES," | grep -q ",${{ env.AUTHOR }},"; then
            gh pr review $PR_NUMBER --request-changes -b "Issue #$ISSUE_NUM is not assigned to you. Please get yourself assigned before submitting work."
            exit 1
          fi

      - name: Check for Merge Conflicts
        run: |
          MERGEABLE=$(gh pr view $PR_NUMBER --json mergeable -q .mergeable)
          if [ "$MERGEABLE" == "CONFLICTING" ]; then
            gh pr comment $PR_NUMBER --body "This PR has merge conflicts with the base branch. Please resolve them so checks can run."
            exit 1
          fi

      - name: AI Advisory Review
        if: success()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY configured; skipping AI advisory. A human maintainer will review this PR."
            exit 0
          fi

          PR_BODY=$(gh pr view $PR_NUMBER --json body -q .body)
          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oEi "(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) #[0-9]+" | head -n1 | grep -oE "[0-9]+")
          ISSUE_BODY=$(gh issue view $ISSUE_NUMBER --json body -q .body)
          PR_DIFF=$(gh pr diff $PR_NUMBER)

          echo "$ISSUE_BODY" > issue.txt
          echo "$PR_DIFF" > diff.txt

          cat << 'EOF' > ai_review.js
          const fs = require('fs');
          const issue = fs.readFileSync('issue.txt', 'utf8');
          const diff = fs.readFileSync('diff.txt', 'utf8');
          const prNumber = process.env.PR_NUMBER;
          const apiKey = process.env.ANTHROPIC_API_KEY;
          const model = process.env.AI_MODEL || 'claude-sonnet-4-6';

          const prompt = `You are a senior reviewer performing a pre-review audit on a Pull Request for an AgTech dApp on Stellar (Next.js frontend, Node.js/Fastify backend, Rust Soroban contracts). You provide ADVISORY feedback only. A human maintainer makes the final call on merging.

          LINKED ISSUE: ${issue}

          PR DIFF: ${diff}

          Check: 1) does the diff implement the issue's explicit requirements, 2) are there obvious bugs or edge cases, 3) tests added/updated for the change, 4) no secrets or unsafe user input, 5) no scope creep beyond the issue.

          Reply with a concise review. Start the comment by tagging the contributor: @AUTHOR. If everything looks fine, say so briefly. If you find problems, list the specific issues and file paths to fix. Keep it under 150 words, no markdown headers, no emojis.`;

          async function run() {
            try {
              const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'x-api-key': apiKey,
                  'anthropic-version': '2023-06-01'
                },
                body: JSON.stringify({
                  model: model,
                  max_tokens: 1000,
                  messages: [{ role: 'user', content: prompt }]
                })
              });
              if (!res.ok) {
                console.error('AI API failed: ' + res.status);
                process.exit(0);
              }
              const data = await res.json();
              const text = data.content[0].text.trim().replace(/^AUTHOR/g, '@${{ env.AUTHOR }}');
              fs.writeFileSync('advisory.txt', text);
            } catch (err) {
              console.error('AI review error: ' + err.message);
              process.exit(0);
            }
          }
          run();
          EOF

          node ai_review.js

          if [ -f advisory.txt ]; then
            gh pr comment $PR_NUMBER --body-file advisory.txt
          fi
          echo "Advisory review posted. A human maintainer will review and merge this PR."
