name: AgriTrust CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  smart-contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned for soroban-sdk 20)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            smartcontract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('smartcontract/Cargo.lock') }}

      - name: Format Check
        working-directory: ./smartcontract
        run: cargo fmt --check

      - name: Lint with Clippy
        working-directory: ./smartcontract
        run: cargo clippy --all-targets --all-features -- -D warnings -A unexpected_cfgs

      - name: Run Soroban Contract Tests
        working-directory: ./smartcontract
        run: cargo test

      - name: Compile Smart Contracts (wasm)
        working-directory: ./smartcontract
        run: cargo build --target wasm32-unknown-unknown --release

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Type-check
        working-directory: ./backend
        run: npm run typecheck

      - name: Build
        working-directory: ./backend
        run: npm run build

      - name: Run Tests
        working-directory: ./backend
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: ./frontend
        run: |
          if [ -f eslint.config.mjs ] || [ -f .eslintrc.json ] || [ -f .eslintrc.js ] || [ -f .eslintrc ]; then
            npx eslint .
          else
            echo "ESLint not configured. Skipping lint."
          fi

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: |
          if grep -q '"test"' package.json; then
            npm test -- --passWithNoTests
          else
            echo "No test script found. Skipping tests."
          fi

      - name: Build Next.js App
        working-directory: ./frontend
        run: npm run build