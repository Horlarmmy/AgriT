[package]
name = "agritrust_vyc"
version = "0.1.0"
edition = "2021"
description = "AgriTrust VYC (Verifiable Yield Certificate) Soroban smart contract"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
